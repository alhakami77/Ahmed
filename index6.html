<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي القراءة والنطق</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 800px;
            width: 95%;
        }
        .controls {
            margin-bottom: 25px;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            transition: 0.3s;
            font-weight: bold;
            margin: 5px;
        }
        .btn-speak { background-color: #3498db; color: white; }
        .btn-reset { background-color: #e74c3c; color: white; }
        button:hover { opacity: 0.9; }

        #display-area {
            margin: 30px 0;
            text-align: left;
            direction: ltr;
            line-height: 2.5;
        }

        .word-container {
            display: inline-block;
            margin-right: 12px;
            margin-bottom: 10px;
            text-align: center;
        }

        .eng-word {
            font-size: 26px;
            display: block;
            color: #d1d1d1;
            letter-spacing: 1px;
        }

        .arb-word {
            font-size: 15px;
            display: block;
            color: #eeeeee; /* مخفي تقريباً */
            direction: rtl;
            margin-top: 2px;
            transition: color 0.4s;
        }

        /* التنسيقات عند الكتابة */
        .correct { color: #2ecc71 !important; font-weight: bold; }
        .active-arb { color: #e67e22 !important; font-weight: bold; }
        .current-letter { border-bottom: 3px solid #f1c40f; color: #333; }
        .punctuation { color: #bdc3c7 !important; }

        #hidden-input { position: fixed; top: -100px; opacity: 0; }
        
        .instructions { 
            color: #7f8c8d; 
            font-size: 0.9rem; 
            margin-top: 20px; 
            border-top: 1px solid #eee; 
            padding-top: 15px;
            direction: rtl;
        }
    </style>
</head>
<body onclick="document.getElementById('hidden-input').focus()">

<div class="container">
    <h2 style="direction: rtl;">تحدي النطق والكتابة 🎧</h2>
    
    <div class="controls">
        <button class="btn-speak" onclick="readFullText()">🔊 نطق النص كاملاً</button>
        <button class="btn-reset" onclick="resetGame()">🔄 إعادة</button>
    </div>

    <input type="text" id="hidden-input" autocomplete="off" autofocus>

    <div id="display-area"></div>
    
    <p class="instructions">
        اكتب الحروف. سيتم تجاوز الرموز (مثل الفواصل) تلقائياً ونطق الكلمة ببطء عند اكتمالها.
    </p>
</div>

<script>
    // النص المطلوب
    const data = [
        { eng: "I", arb: "أنا" },
        { eng: "live", arb: "أعيش" },
        { eng: "with", arb: "مع" },
        { eng: "my", arb: "عائلتي" },
        { eng: "mom,", arb: "أمي" },
        { eng: "dad,", arb: "أبي" },
        { eng: "and", arb: "و" },
        { eng: "5", arb: "خمسة" },
        { eng: "siblings.", arb: "إخوة" },
        { eng: "I", arb: "أنا" },
        { eng: "visit", arb: "أزور" },
        { eng: "my", arb: "جدتي" },
        { eng: "grandma", arb: "جدتي" },
        { eng: "every", arb: "كل" },
        { eng: "day.", arb: "يوم" }
    ];

    const fullText = data.map(item => item.eng).join(' ');
    const displayArea = document.getElementById('display-area');
    const inputElement = document.getElementById('hidden-input');
    
    let currentGlobalIndex = 0;
    let wordRanges = [];

    function init() {
        displayArea.innerHTML = '';
        let charCounter = 0;
        wordRanges = [];

        data.forEach((item, wordIdx) => {
            const wordContainer = document.createElement('div');
            wordContainer.className = 'word-container';

            const engSpan = document.createElement('span');
            engSpan.className = 'eng-word';
            
            let startIdx = charCounter;
            item.eng.split('').forEach(char => {
                const charSpan = document.createElement('span');
                charSpan.innerText = char;
                charSpan.id = `char-${charCounter}`;
                if (/[.,!?;]/.test(char)) charSpan.classList.add('punctuation');
                engSpan.appendChild(charSpan);
                charCounter++;
            });
            let endIdx = charCounter;

            // تسجيل نطاق الكلمة لمعالجة النطق
            wordRanges.push({ start: startIdx, end: endIdx, text: item.eng, id: wordIdx });

            // إضافة مسافة
            if (wordIdx < data.length - 1) {
                const spaceSpan = document.createElement('span');
                spaceSpan.innerText = ' ';
                spaceSpan.id = `char-${charCounter}`;
                engSpan.appendChild(spaceSpan);
                charCounter++;
            }

            const arbSpan = document.createElement('span');
            arbSpan.className = 'arb-word';
            arbSpan.innerText = item.arb;
            arbSpan.id = `arb-${wordIdx}`;

            wordContainer.appendChild(engSpan);
            wordContainer.appendChild(arbSpan);
            displayArea.appendChild(wordContainer);
        });
        
        handleAutoSkip();
        updateHighlight();
    }

    function handleAutoSkip() {
        // تجاوز المسافات والرموز تلقائياً
        while (currentGlobalIndex < fullText.length && /[^a-zA-Z0-9]/.test(fullText[currentGlobalIndex])) {
            const el = document.getElementById(`char-${currentGlobalIndex}`);
            if (el) el.classList.add('correct');
            currentGlobalIndex++;
        }
    }

    function updateHighlight() {
        document.querySelectorAll('.eng-word span').forEach(s => s.classList.remove('current-letter'));
        if (currentGlobalIndex < fullText.length) {
            const el = document.getElementById(`char-${currentGlobalIndex}`);
            if (el) el.classList.add('current-letter');
        }
    }

    function speak(textToSay, rate = 0.6) { // سرعة أبطأ (0.6 بدل 0.8)
        window.speechSynthesis.cancel();
        const cleanText = textToSay.replace(/[^a-zA-Z0-9 ]/g, "");
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'en-US';
        utterance.rate = rate; 
        window.speechSynthesis.speak(utterance);
    }

    inputElement.addEventListener('input', (e) => {
        const charTyped = e.data;
        if (!charTyped || currentGlobalIndex >= fullText.length) return;

        const targetChar = fullText[currentGlobalIndex];

        if (charTyped.toLowerCase() === targetChar.toLowerCase()) {
            document.getElementById(`char-${currentGlobalIndex}`).classList.add('correct');
            currentGlobalIndex++;

            // التحقق من نطق الكلمة
            wordRanges.forEach(range => {
                // إذا وصل المستخدم لنهاية حروف الكلمة (قبل علامات الترقيم أو المسافة)
                const lastCharOfWord = range.text.match(/[a-zA-Z0-9](?=[^a-zA-Z0-9]*$)/);
                const lastValidIdx = range.start + range.text.lastIndexOf(lastCharOfWord);

                if (currentGlobalIndex - 1 === lastValidIdx) {
                    document.getElementById(`arb-${range.id}`).classList.add('active-arb');
                    setTimeout(() => speak(range.text, 0.6), 50);
                }
            });

            handleAutoSkip();
            updateHighlight();
        }
        inputElement.value = '';
    });

    function readFullText() {
        speak(fullText, 0.5);
    }

    function resetGame() {
        window.speechSynthesis.cancel();
        currentGlobalIndex = 0;
        init();
        inputElement.focus();
    }

    init();
    window.onload = () => setTimeout(() => inputElement.focus(), 500);
</script>

</body>
</html>
